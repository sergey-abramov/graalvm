Outputs:
  ApiGatewayUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessAuthApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"
      
  FunctionName:
    Description: "Lambda function name"
    Value: !Ref ServerlessAuthFunction
    Export:
      Name: !Sub "${AWS::StackName}-FunctionName"
