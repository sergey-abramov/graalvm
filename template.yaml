AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Auth Application with GraalVM Native Image

Parameters:
  GoogleClientId:
    Type: String
    Description: Google OAuth2 Client ID
    NoEcho: false
  GoogleClientSecret:
    Type: String
    Description: Google OAuth2 Client Secret
    NoEcho: true

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: provided.al2
    Environment:
      Variables:
        #SPRING_PROFILES_ACTIVE: aws
        GOOGLE_CLIENT_ID: !Ref GoogleClientId
        GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret

Resources:
  # Lambda Function
  ServerlessWebNativeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-auth-function"
      CodeUri: .
      Handler: com.example.graalvm.config.LambdaHandler::handleRequest
      #Handler: NOP
      Events:
        HttpApiEvent:
          Type: HttpApi
          Properties:
            TimeoutInMillis: 20000
            PayloadFormatVersion: '1.0'

      Environment:
        Variables:
          BASE_URL: !Sub "https://${ServerlessAuthApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
    Metadata:
      BuildMethod: makefile
      
