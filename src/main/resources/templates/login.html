<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Serverless Auth App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .login-card { background: white; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .oauth-button { 
            display: block; 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            text-decoration: none; 
            color: #333; 
            transition: all 0.3s;
            text-align: center;
        }
        .oauth-button:hover { background-color: #f8f9fa; text-decoration: none; color: #333; border-color: #007bff; }
        .oauth-button i { margin-right: 10px; font-size: 18px; }
        .google { border-color: #db4437; } .google:hover { border-color: #db4437; background-color: #fdf2f2; }
        .form-control:focus { border-color: #667eea; box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25); }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row w-100">
            <div class="col-md-6 col-lg-4 mx-auto">
                <div class="login-card p-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-shield-alt fa-3x text-primary mb-3"></i>
                        <h2>Welcome Back</h2>
                        <p class="text-muted">Sign in to your account</p>
                    </div>

                    <!-- OAuth2 Login -->
                    <div class="mb-4">
                        <a href="/oauth2/authorization/google" class="oauth-button google">
                            <i class="fab fa-google"></i>Continue with Google
                        </a>
                    </div>

                    <hr class="my-4">

                    <!-- Form Login -->
                    <form th:action="@{/perform-login}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt me-2"></i>Sign In
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p>Don't have an account? <a href="/register" class="text-decoration-none">Sign up</a></p>
                    </div>

                    <!-- Alert Messages -->
                    <div th:if="${param.error}" class="alert alert-danger mt-3">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Invalid email or password.
                    </div>
                    
                    <div th:if="${param.logout}" class="alert alert-success mt-3">
                        <i class="fas fa-check-circle me-2"></i>
                        You have been logged out successfully.
                    </div>
                    
                    <div th:if="${param.registration}" class="alert alert-success mt-3">
                        <i class="fas fa-check-circle me-2"></i>
                        Registration successful! Please sign in.
                    </div>
                    
                    <div th:if="${param['error'] == 'oauth2'}" class="alert alert-warning mt-3">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        OAuth2 authentication failed. Please try again.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
