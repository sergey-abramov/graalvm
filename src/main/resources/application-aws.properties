# AWS Lambda Configuration
spring.profiles.active=aws

# Lambda doesn't need embedded server
spring.main.web-application-type=reactive
server.port=-1

# Cloud Functions
spring.cloud.function.definition=handleRequest

# Database Configuration (Use environment variables in Lambda)
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:password}

# JPA Configuration for AWS
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# OAuth2 Configuration (replace with actual values for AWS)
spring.security.oauth2.client.registration.google.client-id=
spring.security.oauth2.client.registration.google.client-secret=
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=https://your-api-gateway-url.amazonaws.com/Prod/login/oauth2/code/google

# Thymeleaf Configuration
spring.thymeleaf.cache=true

# Disable H2 Console in AWS
spring.h2.console.enabled=false

# Actuator Configuration
management.endpoints.web.exposure.include=health

# Logging Configuration
logging.level.com.example.graalvm=WARN
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n
